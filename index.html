<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f4a100" />
  <meta name="description" content="PetShop — Tu tienda de mascotas siempre disponible, incluso sin internet." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PetShop" />

  <title>PetShop 🐾</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="/public/manifest.json" />

  <!-- Icons -->
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
  <link rel="icon" type="image/png" href="/icons/icon-96x96.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/styles.css" />
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen" class="screen active">
  <div class="login-container">

    <div class="login-brand">
      <span class="brand-paw">🐾</span>
      <h1>PetShop</h1>
      <p>Todo para tu mejor amigo</p>
    </div>

    <form id="loginForm">
      <input id="emailInput" type="email" placeholder="correo" required />
      <input id="passwordInput" type="password" placeholder="contraseña" required />

      <button type="submit" id="loginBtn">Ingresar</button>
    </form>

    <div id="loginError" class="hidden"></div>

    <div id="offlineBanner" class="hidden">
      📵 Sin conexión
    </div>

  </div>
</div>

<!-- APP -->
<div id="appScreen" class="screen hidden">

  <header>
    <button id="menuBtn">☰</button>
    <h2>🐾 PetShop</h2>
    <button id="cartBtn">🛒</button>
    <button id="logoutBtn">👤</button>
  </header>

  <!-- NAV -->
  <nav id="sideNav" class="hidden">
    <button class="nav-link" data-view="home">Inicio</button>
    <button class="nav-link" data-view="products">Productos</button>
    <button class="nav-link" data-view="cart">Carrito</button>
    <button class="nav-link" data-view="orders">Pedidos</button>
  </nav>

  <!-- VIEWS -->
  <main>

    <!-- HOME -->
    <section id="viewHome" class="view active">
      <h2>Bienvenido 🐶</h2>
      <button onclick="app.showView('products')">Ver productos</button>
    </section>

    <!-- PRODUCTS -->
    <section id="viewProducts" class="view hidden">
      <input id="searchInput" placeholder="Buscar..." />
      <div id="productsGrid"></div>
    </section>

    <!-- CART -->
    <section id="viewCart" class="view hidden">
      <div id="cartItems"></div>
      <div id="cartSummary">
        <span id="cartSubtotal"></span>
        <span id="cartTotal"></span>
        <button id="checkoutBtn">Finalizar pedido</button>
      </div>
    </section>

    <!-- ORDERS -->
    <section id="viewOrders" class="view hidden">
      <div id="ordersList"></div>
    </section>

  </main>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button data-view="home">🏠</button>
    <button data-view="products">🛍️</button>
    <button data-view="cart">🛒</button>
    <button data-view="orders">📦</button>
  </nav>

</div>

<!-- MODAL -->
<div id="productModal" class="hidden">
  <div class="modal-content">
    <button id="modalCloseBtn">X</button>
    <div id="modalBody"></div>
  </div>
</div>

<!-- TOAST -->
<div id="toastContainer"></div>

<!-- INSTALL PWA -->
<div id="installPrompt" class="hidden">
  <p>Instala PetShop 📲</p>
  <button id="installBtn">Instalar</button>
  <button id="dismissInstall">Ahora no</button>
</div>

<!-- SCRIPT -->
<script src="/app.js"></script>

</body>
</html>
